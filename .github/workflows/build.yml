name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
          xcodebuild -project DynamicNotch.xcodeproj -scheme DynamicNotch \
            -configuration Release -derivedDataPath build \
            ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=14.6 \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log || {
              grep -E "error:" build.log | sort -u | head -10 | while read -r l; do echo "::error::${l}"; done
              exit 1
            }
      - name: Package
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found: $APP"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/DynamicNotch.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch
          path: ${{ runner.temp }}/DynamicNotch.zip
